name: Service A CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "services/service-a/**"
      - ".github/workflows/service-a-cicd.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-push-update:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------
      # 1. Checkout repository
      # ------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------
      # 2. Create image tag from Git commit
      # ------------------------------------
      - name: Generate image tag
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "Building image tag: $IMAGE_TAG"

      # ------------------------------------
      # 3. Login to Docker Hub
      # ------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ------------------------------------
      # 4. Setup Docker Buildx
      # ------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------
      # 5. Build and push Docker image
      # ------------------------------------
      - name: Build and push Service A
        uses: docker/build-push-action@v6
        with:
          context: ./services/service-a
          file: ./services/service-a/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/service-a:${{ env.IMAGE_TAG }}

      # ------------------------------------
      # 6. Update Helm image tag
      # ------------------------------------
      - name: Update Helm image tag
        run: |
          sed -i "s|^  tag:.*|  tag: \"${IMAGE_TAG}\"|" helm/service-a/values-dev.yaml

          echo "Updated Helm image:"
          grep -A 4 "^image:" helm/service-a/values-dev.yaml

      # ------------------------------------
      # 7. Commit updated Helm values
      # ------------------------------------
      - name: Commit Helm values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/service-a/values-dev.yaml

          if git diff --cached --quiet; then
            echo "No Helm values changes detected."
          else
            git commit -m "Update service-a image to ${IMAGE_TAG} [skip ci]"
            git push origin main
          fi