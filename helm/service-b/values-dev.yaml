replicaCount: 1

image:
  repository: akshaygouda646/service-b
  tag: v1
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  host: service-b-dev.local

config:
  SPRING_PROFILES_ACTIVE: dev
  SERVICE_NAME: service-b

resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    memory: 256Mi
    cpu: 250m

secret:
  create: false
  name: service-b-dev-secret

