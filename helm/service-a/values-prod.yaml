replicaCount: 3

image:
  repository: akshaygouda646/service-a
  tag: v1
  pullPolicy: Always

ingress:
  enabled: true
  host: service-a.example.com

config:
  SPRING_PROFILES_ACTIVE: prod
  SERVICE_NAME: service-a

resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 1Gi
    cpu: "1"

secret:
  create: false
  name: service-a-prod-secret
