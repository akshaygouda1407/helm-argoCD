replicaCount: 1

image:
  repository: akshaygouda646/service-a
  tag: v1
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

containerPort: 8083

service:
  type: ClusterIP
  port: 80
  targetPort: 8083
  nodePort: 30083

config:
  springProfile: default
  applicationName: service-a
  serverPort: "8083"
  loggingLevel: INFO

secret:
  create: false
  existingSecret: ""
  databaseUsername: ""
  databasePassword: ""

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: service-a.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

deployment:
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  enabled: false
  path: /actuator/health/liveness
  initialDelaySeconds: 120
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  enabled: false
  path: /actuator/health/readiness
  initialDelaySeconds: 70
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

podAnnotations: {}

podLabels: {}

podSecurityContext:
  runAsNonRoot: false

securityContext:
  runAsNonRoot: false

nodeSelector: {}

tolerations: []

affinity: {}