apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-a
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/akshaygouda1407/helm-argoCD.git
    targetRevision: main
    path: helm/service-a
  destination:
    server: https://kubernetes.default.svc
    namespace: task3
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true