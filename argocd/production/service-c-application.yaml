apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-c-production
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/akshaygouda1407/helm-argoCD.git
    targetRevision: main
    path: helm/service-c
    helm:
      valueFiles:
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: production

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true